<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Iniciar sesión | Hotel El Descanso
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilos.css') }}"
    >
</head>

<body class="pagina-login">

    <div class="contenedor-login">

        <div class="card tarjeta-login shadow-lg">

            <div class="card-body p-5">

                <div class="text-center mb-4">

                    <div class="logo-login">
                        <i class="bi bi-buildings-fill"></i>
                    </div>

                    <h2 class="mb-1">
                        Hotel El Descanso
                    </h2>

                    <p class="text-muted mb-0">
                        Sistema de Gestión Hotelera
                    </p>

                </div>

                {% with mensajes = get_flashed_messages(with_categories=true) %}

                    {% if mensajes %}

                        {% for categoria, mensaje in mensajes %}

                            <div
                                class="alert alert-{{ categoria }}"
                                role="alert"
                            >
                                {{ mensaje }}
                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}

                <form
                    method="POST"
                    action="{{ url_for('auth.login') }}"
                >

                    <div class="mb-3">

                        <label
                            for="usuario"
                            class="form-label"
                        >
                            Usuario
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>

                            <input
                                type="text"
                                class="form-control"
                                id="usuario"
                                name="usuario"
                                placeholder="Ingrese su usuario"
                                autocomplete="username"
                                required
                                autofocus
                            >

                        </div>

                    </div>

                    <div class="mb-4">

                        <label
                            for="contrasena"
                            class="form-label"
                        >
                            Contraseña
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>

                            <input
                                type="password"
                                class="form-control"
                                id="contrasena"
                                name="contrasena"
                                placeholder="Ingrese su contraseña"
                                autocomplete="current-password"
                                required
                            >

                            <button
                                type="button"
                                class="btn btn-outline-secondary"
                                id="mostrarContrasena"
                                aria-label="Mostrar contraseña"
                            >
                                <i
                                    class="bi bi-eye-fill"
                                    id="iconoContrasena"
                                ></i>
                            </button>

                        </div>

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg"
                        >
                            <i class="bi bi-box-arrow-in-right"></i>
                            Iniciar sesión
                        </button>

                    </div>

                </form>

                <div class="datos-demostracion mt-4">

                    <small>
                        <strong>Acceso de demostración</strong>
                    </small>

                    <small>
                        Usuario: admin
                    </small>

                    <small>
                        Contraseña: admin123
                    </small>

                </div>

            </div>

        </div>

    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const boton = document.getElementById(
                "mostrarContrasena"
            );

            const campo = document.getElementById(
                "contrasena"
            );

            const icono = document.getElementById(
                "iconoContrasena"
            );

            boton.addEventListener("click", function () {
                const estaOculta = campo.type === "password";

                campo.type = estaOculta
                    ? "text"
                    : "password";

                icono.className = estaOculta
                    ? "bi bi-eye-slash-fill"
                    : "bi bi-eye-fill";
            });
        });
    </script>

</body>
</html>
